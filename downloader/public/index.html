<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media Downloader</title>
<style>
  :root { --bg:#0f172a; --card:#1a2338; --accent:#22d3ee; --text:#e5e7eb; --muted:#94a3b8; --border:#263049; --success:#4ade80; --danger:#fb7185; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100svh; overflow-x:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:radial-gradient(ellipse at 12% 4%,rgba(14,116,144,.48),transparent 42%),radial-gradient(ellipse at 88% 76%,rgba(91,33,182,.42),transparent 45%),#050c18; background-attachment:fixed; color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.1); background:rgba(15,23,42,.58); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%); position:sticky;top:0;z-index:100; }
  .site-header h1{font-size:17px;white-space:nowrap;letter-spacing:-.03em}
  .mode-switch{display:flex;align-items:center;gap:4px;padding:5px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .mode-tab{position:relative;display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;color:#aab8ce;text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap;transition:color .3s ease,background .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1)}
  .mode-tab.active{color:#061722;background:linear-gradient(120deg,#67e8f9,#a5f3fc 55%,#c4b5fd);box-shadow:0 5px 22px rgba(34,211,238,.2)}
  .mode-tab:active{transform:scale(.96)}
  .mode-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .about-link{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
  body:before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 18% 10%,rgba(34,211,238,.12),transparent 42%),radial-gradient(ellipse at 85% 75%,rgba(139,92,246,.13),transparent 42%);animation:ambientDrift 18s ease-in-out infinite alternate}
  @keyframes ambientDrift{to{transform:translate3d(2%, -1%,0) scale(1.04)}}
  @media(max-width:560px){.site-header{padding:12px 10px;gap:8px}.site-header h1{font-size:14px}.mode-tab{padding:9px 10px;font-size:11px;gap:6px}.about-link{font-size:11px}}
  header h1 { font-size:18px; margin:0; }
  main { width:min(calc(100% - 28px),640px); min-height:calc(100svh - 142px); margin:clamp(14px,4vh,34px) auto 20px; padding:clamp(14px,3vw,22px); display:flex; align-items:flex-start; justify-content:center; }
  .card { position:relative; isolation:isolate; overflow:hidden; width:100%; background:linear-gradient(135deg,rgba(255,255,255,.19),rgba(180,225,255,.085) 34%,rgba(13,27,49,.38) 100%); border:1px solid rgba(226,245,255,.3); border-radius:24px; padding:clamp(18px,4vw,26px); backdrop-filter:blur(30px) saturate(175%); -webkit-backdrop-filter:blur(30px) saturate(175%); box-shadow:0 28px 90px rgba(0,0,0,.42),0 0 48px rgba(34,211,238,.09),inset 0 1px 0 rgba(255,255,255,.34); } .card:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 8% 0%,rgba(255,255,255,.19),transparent 44%),linear-gradient(115deg,rgba(255,255,255,.055),transparent 42%,rgba(103,232,249,.04));} .card>*{position:relative;z-index:1}
  input[type=text],input[type=password] { width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:rgba(2,12,26,.42); color:var(--text); font-size:14px; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  select { flex:1; min-width:120px; padding:10px; border-radius:8px; border:1px solid var(--border); background:rgba(2,12,26,.42); color:var(--text); }
  button.primary { margin-top:16px; width:100%; padding:12px; border:none; border-radius:8px; background:var(--accent); color:#06202b; font-weight:600; font-size:15px; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  #statusBox { margin-top:16px; font-size:13px; color:var(--muted); min-height:20px; }
  #resultBox { margin-top:12px; }
  #resultBox a { display:inline-block; padding:10px 16px; background:#14532d; color:#bbf7d0; border-radius:8px; text-decoration:none; font-size:14px; }
  .top-links { display:flex; gap:12px; margin-right:104px; align-items:center; }
  .top-links a { font-size:13px; font-weight:650; color:var(--accent); border:1px solid var(--border); border-radius:8px; padding:8px 12px; text-decoration:none; }
  .top-links a:hover { background:var(--card); }
  .history-toggle { position:static; flex:0 0 auto; padding:8px 14px; cursor:pointer; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; }
  .history-panel { position:fixed; top:0; right:0; transform:translateX(105%); width:min(360px,100vw); max-width:100vw; height:100dvh; background:#101728; border-left:1px solid var(--border); transition:transform .25s ease; overflow-y:auto; z-index:1000; }
  .history-panel.open { transform:translateX(0); }
  .history-header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid var(--border); }
  .history-header button { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
  .history-item { display:flex; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .history-item img { width:64px; height:40px; object-fit:cover; border-radius:4px; background:#000; }
  .history-item .meta { flex:1; min-width:0; }
  .history-item .title { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-item .sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .history-item .actions { display:flex; gap:8px; margin-top:6px; }
  .history-item .actions a,.history-item .actions button { font-size:11px; padding:3px 8px; border-radius:6px; border:1px solid var(--border); background:#0b1222; color:var(--text); cursor:pointer; text-decoration:none; }
  .empty { padding:20px; color:var(--muted); font-size:13px; text-align:center; }
  #loginOverlay { position:fixed; inset:0; padding:16px; background:rgba(3,10,22,.72); backdrop-filter:blur(28px) saturate(150%); -webkit-backdrop-filter:blur(28px) saturate(150%); display:flex; align-items:center; justify-content:center; z-index:2000; }
  #loginOverlay .card { width:min(420px,100%); }
  #loginOverlay p { color:var(--muted); font-size:13px; margin:8px 0 0; }
  .hidden { display:none !important; }
  .detected { margin-top:10px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:12px; color:var(--muted); }

  /* Detailed staged loading panel */
  .progress-panel { margin-top:18px; border:1px solid var(--border); border-radius:12px; background:#10192d; overflow:hidden; }
  .progress-head { display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid var(--border); }
  .progress-orb { width:38px; height:38px; flex:0 0 38px; border-radius:50%; display:grid; place-items:center; border:2px solid #334155; position:relative; }
  .progress-orb::before { content:""; width:16px; height:16px; border-radius:50%; border:2px solid #64748b; border-top-color:transparent; animation:spin .8s linear infinite; }
  .progress-orb.done::before { display:none; }
  .progress-orb.done::after { content:"✓"; color:var(--success); font-weight:800; font-size:19px; }
  .progress-title { font-size:14px; font-weight:700; }
  .progress-detail { margin-top:3px; color:var(--muted); font-size:11px; }
  .stage-list { padding:12px 16px 15px; }
  .stage { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; min-height:45px; position:relative; }
  .stage:not(:last-child)::after { content:""; position:absolute; left:13px; top:31px; bottom:-13px; width:2px; background:#273449; }
  .stage-marker { width:28px; height:28px; border-radius:50%; border:1px solid #334155; background:#0b1222; display:grid; place-items:center; font-size:11px; color:#64748b; z-index:1; }
  .stage.active .stage-marker { border-color:var(--accent); box-shadow:0 0 0 4px rgba(34,211,238,.08); color:var(--accent); }
  .stage.active .stage-marker::after { content:""; width:10px; height:10px; border:2px solid var(--accent); border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  .stage.done .stage-marker { border-color:var(--success); color:var(--success); }
  .stage.done .stage-marker::after { content:"✓"; font-weight:800; }
  .stage.failed .stage-marker { border-color:var(--danger); color:var(--danger); }
  .stage.failed .stage-marker::after { content:"!"; font-weight:800; }
  .stage-name { font-size:12px; color:#cbd5e1; }
  .stage-detail { font-size:10px; color:#64748b; margin-top:2px; }
  .stage.active .stage-name { color:var(--text); font-weight:600; }
  .stage.done .stage-name { color:#a7f3d0; }
  .stage-time { font-size:10px; color:#64748b; min-width:45px; text-align:right; }
  .progress-track { height:3px; background:#1e293b; }
  .progress-fill { height:100%; width:0; background:var(--accent); transition:width .5s ease; box-shadow:0 0 12px rgba(34,211,238,.35); }
  .progress-panel.complete .progress-fill { background:var(--success); box-shadow:none; }
  .progress-panel.error .progress-fill { background:var(--danger); box-shadow:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Responsive viewport and stronger liquid-glass treatment */
  html,body{width:100%;max-width:100%;overflow-x:clip}body{min-height:100svh}header.site-header{flex-wrap:wrap;min-width:0;max-width:100%;gap:10px}main{width:min(calc(100% - 24px),640px);min-height:0;max-width:100%;padding:clamp(10px,3vw,20px);margin:clamp(12px,3vh,26px) auto 20px}.card{min-width:0;max-width:100%;background:linear-gradient(135deg,rgba(255,255,255,.27),rgba(180,225,255,.15) 28%,rgba(13,27,49,.56) 70%,rgba(103,80,170,.17));border-color:rgba(226,245,255,.46);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);box-shadow:0 30px 95px rgba(0,0,0,.5),0 0 55px rgba(34,211,238,.14),inset 0 1.5px 0 rgba(255,255,255,.48)}.card:before{background:radial-gradient(ellipse at 8% 0%,rgba(255,255,255,.28),transparent 44%),linear-gradient(115deg,rgba(255,255,255,.09),transparent 42%,rgba(103,232,249,.07))}input,select,button{max-width:100%}.row>*{min-width:0}.progress-panel{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(9,24,43,.52));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-color:rgba(255,255,255,.22)}
  .site-footer { text-align:center; color:var(--muted); padding:0 16px 26px; font-size:12px; }
  .site-footer a { color:var(--accent); }
  @media (max-width:560px) { header.site-header{padding:10px 8px;gap:7px}.site-header h1{font-size:13px}.mode-switch{order:3;width:100%;justify-content:center}.mode-tab{flex:1;justify-content:center;padding:9px 8px;font-size:10px}.about-link{margin-left:auto}.history-toggle{padding:7px 9px;font-size:11px}main{width:calc(100% - 16px);margin:10px auto 14px;padding:0}.card{padding:16px;border-radius:20px}.history-panel{width:min(360px,100vw)}.stage-time{display:none}.progress-head{padding:12px}.stage-list{padding:10px 12px}.stage{grid-template-columns:26px minmax(0,1fr);gap:8px}.stage-detail{overflow-wrap:anywhere}}
  .history-toggle{position:static}
</style>
</head>
<body>
<div id="loginOverlay" class="hidden"><div class="card"><h2 style="margin-top:0;font-size:16px;">Enter password</h2><input type="password" id="passwordInput" placeholder="Access password" /><button class="primary" id="loginBtn">Unlock</button><p id="loginError"></p></div></div>
<div id="app" class="hidden">
  <header class="site-header"><h1>Timzee Tools</h1><nav class="mode-switch" aria-label="Main navigation"><a class="mode-tab active" href="/" aria-current="page"><span class="mode-dot"></span>Media Download</a><a class="mode-tab" href="/linktree"><span class="mode-dot"></span>Link Tree</a></nav><a class="about-link" href="/about">About</a><button class="history-toggle" id="openHistory" aria-controls="historyPanel">History</button></header>
  <div class="history-panel" id="historyPanel"><div class="history-header"><strong>Download History</strong><button id="closeHistory">&times;</button></div><div id="historyList"></div></div>
  <main><div class="card">
    <input type="text" id="urlInput" placeholder="Paste a video or audio link..." />
    <div id="detectedBox" class="detected hidden"></div>
    <div class="row"><select id="typeSelect"><option value="video">Video (with sound)</option><option value="audio">Sound only (MP3)</option></select><select id="qualitySelect"><option value="best">Best available</option></select></div>
    <button class="primary" id="downloadBtn">Download</button>
    <div id="statusBox"></div>
    <div id="progressPanel" class="progress-panel hidden" aria-live="polite">
      <div class="progress-head"><div class="progress-orb" id="progressOrb"></div><div><div class="progress-title" id="progressTitle">Preparing download</div><div class="progress-detail" id="progressDetail">Starting...</div></div></div>
      <div class="stage-list" id="stageList"></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div id="resultBox"></div>
  </div></main>
  <footer class="site-footer">Powered by <strong>Timzee Corp</strong> <span aria-hidden="true">·</span> <a href="/about">About this tool</a></footer>
</div>
<script>
const $ = sel => document.querySelector(sel);
async function checkAuth(){const res=await fetch('/api/me');const data=await res.json();if(!data.authRequired||data.authenticated){$('#loginOverlay').classList.add('hidden');$('#app').classList.remove('hidden');}else{$('#loginOverlay').classList.remove('hidden');$('#app').classList.add('hidden');}}
$('#loginBtn').addEventListener('click',async()=>{const password=$('#passwordInput').value;const errBox=$('#loginError');errBox.textContent='';const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(res.ok)checkAuth();else errBox.textContent='Wrong password.';});
$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
checkAuth();
const typeSelect=$('#typeSelect'),qualitySelect=$('#qualitySelect'),urlInput=$('#urlInput'),detectedBox=$('#detectedBox');
const FALLBACK_HEIGHTS=[2160,1440,1080,720,480,360];
function renderQualityOptions(heights){qualitySelect.innerHTML='<option value="best">Best available</option>';heights.forEach(h=>{const opt=document.createElement('option');opt.value=`${h}p`;opt.textContent=`${h}p`;qualitySelect.appendChild(opt);});}
renderQualityOptions(FALLBACK_HEIGHTS);
typeSelect.addEventListener('change',()=>{qualitySelect.style.display=typeSelect.value==='audio'?'none':'';});
let detectedContentType='video';
let infoDebounce;
urlInput.addEventListener('input',()=>{
  clearTimeout(infoDebounce); detectedContentType='video'; detectedBox.classList.add('hidden');
  const url=urlInput.value.trim(); if(!url)return;
  infoDebounce=setTimeout(async()=>{
    try{
      const res=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
      if(!res.ok)return;
      const data=await res.json();
      detectedContentType=data.contentType||'video';
      if(detectedContentType==='photo'){
        typeSelect.value='video'; typeSelect.disabled=true; qualitySelect.style.display='none';
        detectedBox.textContent=`TikTok photo slideshow detected — ${data.imageCount||'multiple'} image(s) will be saved together as a ZIP.`;
        detectedBox.classList.remove('hidden');
      }else{
        typeSelect.disabled=false; qualitySelect.style.display=typeSelect.value==='audio'?'none':'';
        if(data.availableHeights&&data.availableHeights.length)renderQualityOptions(data.availableHeights);
      }
    }catch{}
  },800);
});

const progressPanel=$('#progressPanel'),progressList=$('#stageList'),progressFill=$('#progressFill'),progressTitle=$('#progressTitle'),progressDetail=$('#progressDetail'),progressOrb=$('#progressOrb');
let stageTimers=[];
function clearStageTimers(){stageTimers.forEach(clearTimeout);stageTimers=[];}
function buildStages(isPhoto){
  return isPhoto ? [
    ['Validate link','Checking the URL and security rules.'],
    ['Resolve TikTok post','Following the short link and reading the photo post.'],
    ['Fetch images','Downloading each image from the slideshow.'],
    ['Build ZIP archive','Packaging the images into one downloadable file.'],
    ['Finalize','Checking the archive and preparing your download.']
  ] : [
    ['Validate link','Checking the URL and security rules.'],
    ['Read media information','Finding the title, formats and available quality.'],
    ['Download media','Fetching the selected video or audio stream.'],
    ['Process media','Combining streams or converting to the requested format.'],
    ['Finalize','Checking the file and preparing your download.']
  ];
}
function startProgress(isPhoto){
  clearStageTimers();
  const stages=buildStages(isPhoto);
  progressPanel.classList.remove('hidden','complete','error');
  progressOrb.classList.remove('done');
  progressList.innerHTML=stages.map((s,i)=>`<div class="stage" data-stage="${i}"><div class="stage-marker">${i+1}</div><div><div class="stage-name">${s[0]}</div><div class="stage-detail">${s[1]}</div></div><div class="stage-time" data-time="${i}"></div></div>`).join('');
  setStage(0,stages.length);
  const delays=isPhoto?[900,2600,5200,9000]:[900,2400,4200,8000];
  delays.forEach((delay,i)=>stageTimers.push(setTimeout(()=>setStage(i+1,stages.length),delay)));
}
function setStage(index,total){
  const stages=[...progressList.querySelectorAll('.stage')];
  stages.forEach((el,i)=>{el.classList.toggle('active',i===index);el.classList.toggle('done',i<index);if(i===index)el.classList.remove('failed');});
  if(index<total){progressTitle.textContent=stages[index].querySelector('.stage-name').textContent;progressDetail.textContent=stages[index].querySelector('.stage-detail').textContent;progressFill.style.width=`${Math.max(5,(index/total)*92)}%`;}
}
function finishProgress(success,errorMessage){
  clearStageTimers();
  const stages=[...progressList.querySelectorAll('.stage')];
  if(success){stages.forEach(s=>{s.classList.remove('active');s.classList.add('done');});progressTitle.textContent='Download ready';progressDetail.textContent='Everything is finished. Your file is ready to save.';progressFill.style.width='100%';progressPanel.classList.add('complete');progressOrb.classList.add('done');}
  else {const active=stages.find(s=>s.classList.contains('active'))||stages[stages.length-1];stages.forEach(s=>s.classList.remove('active'));if(active)active.classList.add('failed');progressTitle.textContent='Download failed';progressDetail.textContent=errorMessage||'The server could not complete the download.';progressPanel.classList.add('error');}
}

$('#downloadBtn').addEventListener('click',async()=>{
  const url=urlInput.value.trim(),type=detectedContentType==='photo'?'video':typeSelect.value,quality=qualitySelect.value,statusBox=$('#statusBox'),resultBox=$('#resultBox'),btn=$('#downloadBtn');
  resultBox.innerHTML=''; if(!url){statusBox.textContent='Paste a link first.';return;}
  btn.disabled=true; const isPhoto=detectedContentType==='photo'; startProgress(isPhoto); statusBox.textContent=isPhoto?'Preparing the photo slideshow...':'Starting download...';
  try{
    const startRes=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,type,quality})});
    const startData=await startRes.json(); if(!startRes.ok)throw new Error(startData.error||'Failed to start.');
    const jobId=startData.jobId; statusBox.textContent=isPhoto?'Downloading the photos and building your ZIP...':'Processing your media...';
    let consecutiveFailures=0; const MAX_FAILURES=5;
    const poll=setInterval(async()=>{try{const statusRes=await fetch(`/api/status/${jobId}`);if(!statusRes.ok)throw new Error(`status check failed (${statusRes.status})`);const job=await statusRes.json();consecutiveFailures=0;
      if(job.status==='done'){clearInterval(poll);finishProgress(true);statusBox.textContent=`Done: ${job.title||'Download ready'}`;resultBox.innerHTML=`<a href="/files/${jobId}" download>Save file</a>`;btn.disabled=false;loadHistory();}
      else if(job.status==='failed'){clearInterval(poll);finishProgress(false,job.error||'Unknown error.');statusBox.textContent=`Failed: ${job.error||'Unknown error'}`;btn.disabled=false;}
    }catch{consecutiveFailures++;if(consecutiveFailures>=MAX_FAILURES){clearInterval(poll);finishProgress(false,'Lost connection while checking progress. Refresh and check History.');statusBox.textContent='Lost connection while checking progress — please refresh and check History.';btn.disabled=false;}}},2500);
  }catch(err){finishProgress(false,err.message);statusBox.textContent=`Error: ${err.message}`;btn.disabled=false;}
});
const panel=$('#historyPanel');$('#openHistory').onclick=()=>{panel.classList.add('open');loadHistory();};$('#closeHistory').onclick=()=>panel.classList.remove('open');
function formatSize(bytes){if(!bytes)return'';const mb=bytes/(1024*1024);return mb>1024?(mb/1024).toFixed(1)+' GB':mb.toFixed(1)+' MB';}
function escapeHtml(str){const div=document.createElement('div');div.textContent=str||'';return div.innerHTML;}
async function loadHistory(){const res=await fetch('/api/history');if(!res.ok)return;const items=await res.json();const list=$('#historyList');if(!items.length){list.innerHTML='<div class="empty">No downloads yet.</div>';return;}list.innerHTML=items.map(item=>{const label=item.type==='audio'?'MP3':item.type==='photo'?`Photo slideshow (${item.imageCount||'multiple'} images)`:'Video';return `<div class="history-item"><img src="${item.thumbnail||''}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="title">${escapeHtml(item.title)}</div><div class="sub">${item.sourcePlatform||''} · ${label} · ${formatSize(item.fileSize)}</div><div class="actions"><a href="/files/${item.id}" download>Save</a><button onclick="deleteItem('${item.id}')">Delete</button></div></div></div>`;}).join('');}
async function deleteItem(id){await fetch(`/api/history/${id}`,{method:'DELETE'});loadHistory();}
</script>
</body>
</html>
