<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Clipora Plans</title>
<style>
:root{color-scheme:dark;--line:#ffffff24;--muted:#9eb0c7;--ink:#edf5ff;--cyan:#67e8f9}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 8% 0%,#0e526b,transparent 42%),radial-gradient(ellipse at 90% 90%,#33205e,transparent 45%),#07111f;color:var(--ink);font:14px Inter,system-ui,sans-serif}header{padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:#07111fc9;backdrop-filter:blur(20px)}header a{color:var(--cyan);text-decoration:none;font-weight:850}main{width:min(1050px,calc(100% - 28px));margin:36px auto}.intro{text-align:center;margin:30px auto 32px;max-width:620px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--cyan);font-weight:800}.intro h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.055em;margin:10px 0}.intro p,.muted{color:var(--muted);line-height:1.65}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:16px}.card{padding:22px;border-radius:22px;border:1px solid #ffffff2b;background:linear-gradient(140deg,#ffffff20,#ffffff08 60%,#a78bfa12);backdrop-filter:blur(25px);box-shadow:0 24px 70px #0005,inset 0 1px #ffffff24}.card h2{margin:0;font-size:21px}.price{font-size:32px;font-weight:850;letter-spacing:-.05em;margin:16px 0 5px}.features{padding:0;list-style:none;color:#c9d7e7;line-height:2}.features li:before{content:'✓';color:var(--cyan);margin-right:9px}.btn{border:0;border-radius:12px;padding:13px 16px;width:100%;font:inherit;font-weight:850;color:#061522;background:linear-gradient(120deg,#67e8f9,#c4b5fd);cursor:pointer}.field{display:grid;gap:7px;margin:14px 0}.field input,.field textarea{padding:12px;border-radius:11px;border:1px solid var(--line);background:#06101eaa;color:var(--ink);font:inherit;width:100%}.notice{text-align:center;color:var(--muted);margin:18px 0;min-height:20px}.auth{max-width:430px;margin:24px auto;padding:22px;border:1px solid var(--line);border-radius:20px;background:#ffffff0c}.hidden{display:none!important}@media(max-width:520px){main{margin:20px auto}.card{padding:18px}}

/* Shared Clipora navigation — consistent across public pages */
.clipora-header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:66px;padding:11px clamp(12px,4vw,34px);border-bottom:1px solid rgba(226,245,255,.16);background:rgba(5,14,27,.72);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%)}
.clipora-brand{display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;color:#f3f8ff;text-decoration:none;font-size:14px;font-weight:850;letter-spacing:.055em}
.clipora-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#071522;background:linear-gradient(135deg,#67e8f9,#a5f3fc 55%,#a78bfa);box-shadow:0 4px 20px rgba(34,211,238,.22);font-size:19px;font-weight:900;letter-spacing:-.06em}
.clipora-nav{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;padding:4px;border:1px solid rgba(226,245,255,.16);border-radius:999px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.clipora-nav a,.clipora-about{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:8px 13px;border-radius:999px;color:#aab8ce;text-decoration:none;font-size:11px;font-weight:750;white-space:nowrap;transition:background .2s ease,color .2s ease,box-shadow .2s ease}
.clipora-nav a:hover,.clipora-about:hover{color:#f3f8ff;background:rgba(255,255,255,.08)}
.clipora-nav a.active{color:#071522;background:linear-gradient(120deg,#67e8f9,#a5f3fc,#a78bfa);box-shadow:0 4px 18px rgba(34,211,238,.18)}
.clipora-about{flex:0 0 auto}.clipora-about.active{color:#67e8f9;background:rgba(103,232,249,.09)}
@media(max-width:620px){.clipora-header{gap:8px;padding:9px 10px;min-height:58px}.clipora-brand{gap:6px;font-size:11px}.clipora-mark{width:29px;height:29px;border-radius:9px;font-size:16px}.clipora-nav{gap:2px;padding:3px}.clipora-nav a,.clipora-about{min-height:31px;padding:7px 8px;font-size:9px}.clipora-about{font-size:10px}}
@media(max-width:390px){.clipora-header{flex-wrap:wrap}.clipora-nav{order:3;width:100%;justify-content:stretch}.clipora-nav a{flex:1}.clipora-about{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.clipora-nav a,.clipora-about{transition:none}}
</style></head><body><header class="clipora-header"><a class="clipora-brand" href="/" aria-label="Clipora home"><span class="clipora-mark" aria-hidden="true">C</span><span>CLIPORA</span></a><nav class="clipora-nav" aria-label="Main navigation"><a href="/">Media Download</a><a href="/linktree">Link Studio</a><a href="/plans" class="active" aria-current="page">Plans</a><a href="/business">Business</a></nav><a class="clipora-about" href="/about">About</a></header><main><section class="intro"><div class="eyebrow">SIMPLE, TRANSPARENT UPGRADES</div><h1>Choose your next level.</h1><p>Compare Free, Pro and Business. Paid plans use secure Paystack checkout; features activate only after payment is verified.</p></section><section id="plans" class="plans"><div class="muted">Loading plans…</div></section><div id="notice" class="notice" role="status"></div>
<section id="auth" class="auth hidden"><h2>Sign in to request this plan</h2><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in</button></form></section></main>
<script type="module">
import { createInternalNeonAuth } from 'https://esm.sh/@neondatabase/auth@0.7.0-beta';
const neonAuth=createInternalNeonAuth('https://ep-green-field-bjni81tw.neonauth.c-3.eu-west-2.aws.neon.tech/neondb/auth');const auth=neonAuth.adapter;let token='';const $=id=>document.getElementById(id);
function note(t){$('notice').textContent=t;}
async function api(path,options={}){const r=await fetch('/api/linktree'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function load(){try{const d=await api('/plans');$('plans').replaceChildren();if(!d.plans.length){$('plans').textContent='Plans are being prepared. Check back soon.';return;}for(const p of d.plans){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=p.price_minor===0?'Free':'₦'+(Number(p.price_minor)/100).toLocaleString('en-NG');const interval=document.createElement('div');interval.className='muted';interval.textContent=p.billing_interval==='one_time'?'One-time payment':'per '+p.billing_interval.replace('ly','');const desc=document.createElement('p');desc.className='muted';desc.textContent=p.description;const features=document.createElement('ul');features.className='features';(p.features||[]).forEach(f=>{const li=document.createElement('li');li.textContent=f;features.append(li);});const btn=document.createElement('button');btn.className='btn';btn.textContent=Number(p.price_minor)===0?'Your current free option':'Continue to Paystack';btn.disabled=Number(p.price_minor)===0;btn.setAttribute('aria-label',Number(p.price_minor)===0?'Free plan':'Subscribe to '+p.name);btn.onclick=()=>checkoutPlan(p);card.append(title,price,interval,desc,features,btn);$('plans').append(card);}}catch(e){note(e.message);}}
async function checkoutPlan(p){try{if(!token){$('auth').classList.remove('hidden');note('Sign in to continue to secure checkout.');return;}const d=await api('/billing/checkout',{method:'POST',body:JSON.stringify({plan_slug:p.slug})});if(!d.authorization_url)throw new Error('Paystack did not return a checkout link.');window.location.assign(d.authorization_url);}catch(e){note(e.message);}}
$('authForm').onsubmit=async e=>{e.preventDefault();try{const r=await auth.signIn.email({email:$('email').value.trim(),password:$('password').value});if(r?.error)throw new Error(r.error.message||'Sign-in failed');token=await neonAuth.getJWTToken()||'';if(!token)throw new Error('Could not create a secure session.');$('auth').classList.add('hidden');const params=new URLSearchParams(location.search),ref=params.get('reference')||params.get('trxref');if(ref){await api('/billing/verify/'+encodeURIComponent(ref));history.replaceState({},'','/plans');note('Payment verified. Your plan is now active.');}else note('Signed in. Select a paid plan to continue.');}catch(e){note(e.message);}};
token=await neonAuth.getJWTToken()||'';await load();const params=new URLSearchParams(location.search);const ref=params.get('reference')||params.get('trxref');if(ref){if(!token){$('auth').classList.remove('hidden');note('Sign in again to verify your payment.');}else{try{await api('/billing/verify/'+encodeURIComponent(ref));note('Payment verified. Your plan is now active.');history.replaceState({},'', '/plans');}catch(e){note(e.message);}}}
</script></body></html>
