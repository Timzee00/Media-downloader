<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Clipora Plans</title>
<style>
:root{color-scheme:dark;--line:#ffffff24;--muted:#9eb0c7;--ink:#edf5ff;--cyan:#67e8f9}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 8% 0%,#0e526b,transparent 42%),radial-gradient(ellipse at 90% 90%,#33205e,transparent 45%),#07111f;color:var(--ink);font:14px Inter,system-ui,sans-serif}header{padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:#07111fc9;backdrop-filter:blur(20px)}header a{color:var(--cyan);text-decoration:none;font-weight:850}main{width:min(1050px,calc(100% - 28px));margin:36px auto}.intro{text-align:center;margin:30px auto 32px;max-width:620px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--cyan);font-weight:800}.intro h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.055em;margin:10px 0}.intro p,.muted{color:var(--muted);line-height:1.65}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:16px}.card{padding:22px;border-radius:22px;border:1px solid #ffffff2b;background:linear-gradient(140deg,#ffffff20,#ffffff08 60%,#a78bfa12);backdrop-filter:blur(25px);box-shadow:0 24px 70px #0005,inset 0 1px #ffffff24}.card h2{margin:0;font-size:21px}.price{font-size:32px;font-weight:850;letter-spacing:-.05em;margin:16px 0 5px}.features{padding:0;list-style:none;color:#c9d7e7;line-height:2}.features li:before{content:'✓';color:var(--cyan);margin-right:9px}.btn{border:0;border-radius:12px;padding:13px 16px;width:100%;font:inherit;font-weight:850;color:#061522;background:linear-gradient(120deg,#67e8f9,#c4b5fd);cursor:pointer}.field{display:grid;gap:7px;margin:14px 0}.field input,.field textarea{padding:12px;border-radius:11px;border:1px solid var(--line);background:#06101eaa;color:var(--ink);font:inherit;width:100%}.notice{text-align:center;color:var(--muted);margin:18px 0;min-height:20px}.auth{max-width:430px;margin:24px auto;padding:22px;border:1px solid var(--line);border-radius:20px;background:#ffffff0c}.hidden{display:none!important}@media(max-width:520px){main{margin:20px auto}.card{padding:18px}}
</style></head><body><header><a href="/linktree">CLIPORA</a></header><main><section class="intro"><div class="eyebrow">SIMPLE, TRANSPARENT UPGRADES</div><h1>Choose your next level.</h1><p>Choose a plan to request an upgrade. Your request is saved securely and sent to the Clipora owner on WhatsApp for follow-up.</p></section><section id="plans" class="plans"><div class="muted">Loading plans…</div></section><div id="notice" class="notice" role="status"></div>
<section id="auth" class="auth hidden"><h2>Sign in to request this plan</h2><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in</button></form></section></main>
<script type="module">
import { createInternalNeonAuth } from 'https://esm.sh/@neondatabase/auth@0.7.0-beta';
const neonAuth=createInternalNeonAuth('https://ep-green-field-bjni81tw.neonauth.c-3.eu-west-2.aws.neon.tech/neondb/auth');const auth=neonAuth.adapter;let token='';const $=id=>document.getElementById(id);
function note(t){$('notice').textContent=t;}
async function api(path,options={}){const r=await fetch('/api/linktree'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function load(){try{const d=await api('/plans');$('plans').replaceChildren();if(!d.plans.length){$('plans').textContent='Plans are being prepared. Check back soon.';return;}for(const p of d.plans){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=p.price_minor===0?'Free':'₦'+(Number(p.price_minor)/100).toLocaleString('en-NG');const interval=document.createElement('div');interval.className='muted';interval.textContent=p.billing_interval==='one_time'?'One-time payment':'per '+p.billing_interval.replace('ly','');const desc=document.createElement('p');desc.className='muted';desc.textContent=p.description;const features=document.createElement('ul');features.className='features';(p.features||[]).forEach(f=>{const li=document.createElement('li');li.textContent=f;features.append(li);});const btn=document.createElement('button');btn.className='btn';btn.textContent='Request this plan';btn.onclick=()=>requestPlan(p);card.append(title,price,interval,desc,features,btn);$('plans').append(card);}}catch(e){note(e.message);}}
async function requestPlan(p){try{if(!token){$('auth').classList.remove('hidden');note('Sign in first.');return;}const message=prompt('Add a note for the Clipora team (optional):','');if(message===null)return;const d=await api('/plan-requests',{method:'POST',body:JSON.stringify({plan_id:p.id,message})});note('Your request has been saved. WhatsApp will open with the request details.');window.location.href=d.whatsapp_url;}catch(e){note(e.message);}}
$('authForm').onsubmit=async e=>{e.preventDefault();try{const r=await auth.signIn.email({email:$('email').value.trim(),password:$('password').value});if(r?.error)throw new Error(r.error.message||'Sign-in failed');token=await neonAuth.getJWTToken()||'';if(!token)throw new Error('Could not create a secure session.');$('auth').classList.add('hidden');note('Signed in. Select your plan again.');}catch(e){note(e.message);}};
token=await neonAuth.getJWTToken()||'';await load();
</script></body></html>
